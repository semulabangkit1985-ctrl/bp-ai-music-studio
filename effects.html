<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muat Naik & Genre - BP AI Music Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url('/kl.jpg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.65);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            z-index: 1;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #3b82f6;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #93c5fd;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-action:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
    </style>
</head>
<body>

    <div class="container">
        <h1>BP AI Studio Console</h1>

        <div class="card">
            <div class="card-title">Muat Naik Trek Audio</div>
            <p style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 8px;">Pilih fail format .mp3 atau .wav untuk mula diproses:</p>
            <input type="file" id="audioFile" accept=".mp3, .wav" style="width: 100%; color: #d1d5db; font-size: 0.85rem; padding: 10px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; cursor: pointer; margin-bottom: 16px;" onchange="handleFile(this)">
            
            <audio id="audioPlayer" controls style="width: 100%; display: none; margin-bottom: 16px; border-radius: 8px;"></audio>

            <hr style="border: none; border-top: 1px solid rgba(59, 130, 246, 0.2); margin-bottom: 16px;">

            <div class="card-title">Pilih Genre Lagu</div>
            <p style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 8px;">Tetapkan genre bagi membantu AI membuat penyesuaian:</p>
            
            <select id="genreSelect" style="width: 100%; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; padding: 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;">
                <option value="Malaya / Melayu">Malaya / Melayu</option>
                <option value="Pop Melayu">Pop Melayu</option>
                <option value="Rock Melayu">Rock Melayu</option>
                <option value="Hip Hop">Hip Hop</option>
                <option value="Phonk">Phonk</option>
                <option value="EDM / Techno">EDM / Techno</option>
                <option value="Cinematic">Cinematic</option>
            </select>

            <button class="btn-action" onclick="goToEffects()">Seterusnya ke Mastering Styles ➔</button>
        </div>
    </div>

    <script>
        let uploadedFilename = "";

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                uploadedFilename = file.name;
                const player = document.getElementById("audioPlayer");
                player.src = URL.createObjectURL(file);
                player.style.display = "block";
            }
        }

        function goToEffects() {
            const selectedGenre = document.getElementById('genreSelect').value;
            // Simpan pilihan genre/fail dalam localStorage jika perlu untuk dibawa ke halaman seterusnya
            localStorage.setItem('selectedGenre', selectedGenre);
            localStorage.setItem('audioFilename', uploadedFilename);
            
            // Pindah ke halaman mastering effects
            window.location.href = "effects.html";
        }
    </script>
</body>
</html>
