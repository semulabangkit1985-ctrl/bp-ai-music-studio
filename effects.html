<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langkah 2 - BP AI Music Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('Untitled design.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }
        .main-box {
            background-color: rgba(30, 41, 59, 0.95);
            padding: 25px;
            border-radius: 15px;
            color: white;
            text-align: left;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 30px 0;
        }
        h2 {
            margin-top: 0;
            color: #818cf8;
            text-align: center;
            margin-bottom: 5px;
        }
        .tagline {
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .step-indicator {
            text-align: center;
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .section-title {
            font-size: 14px;
            color: #38bdf8;
            margin: 15px 0 8px 0;
            font-weight: bold;
        }
        .effects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .effects-grid label {
            background: #334155;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .effects-grid input {
            accent-color: #4f46e5;
        }
        .slider-group {
            margin-bottom: 12px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
            color: #e2e8f0;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4f46e5;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button, .btn-back {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        button {
            flex: 2;
        }
        .btn-back {
            background-color: #475569;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background-color: #16a34a;
        }
        .btn-back:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h2>BP AI Music Studio</h2>
        <div class="tagline">ROCK · HIP HOP · MALAYA</div>
        <div class="step-indicator">Langkah 2 dari 2: Kesan AI & EQ</div>
        
        <form action="result.html" method="get">
            
            <div class="slider-group">
                <label>Intensity Mastering: <span id="intVal">50</span>%</label>
                <input type="range" name="intensity" min="0" max="100" value="50" oninput="document.getElementById('intVal').innerText = this.value">
            </div>

            <div class="section-title">🎛️ AI Audio Processing</div>
            <div class="effects-grid">
                <label><input type="checkbox" name="effect" value="universal"> Universal</label>
                <label><input type="checkbox" name="effect" value="fire"> Fire</label>
                <label><input type="checkbox" name="effect" value="clarity"> Clarity</label>
                <label><input type="checkbox" name="effect" value="tape"> Tape</label>
                <label><input type="checkbox" name="effect" value="natural"> Natural</label>
                <label><input type="checkbox" name="effect" value="spatial"> Spatial</label>
                <label><input type="checkbox" name="effect" value="cinematic"> Cinematic</label>
                <label><input type="checkbox" name="effect" value="punch"> Punch</label>
            </div>

            <div class="section-title">🎚️ Equalizer (EQ)</div>
            
            <div class="slider-group">
                <label>LOW (Bass): <span id="lowVal">0</span> dB</label>
                <input type="range" name="eq_low" min="-12" max="12" value="0" oninput="document.getElementById('lowVal').innerText = this.value">
            </div>

            <div class="slider-group">
                <label>MID (Vocals): <span id="midVal">0</span> dB</label>
                <input type="range" name="eq_mid" min="-12" max="12" value="0" oninput="document.getElementById('midVal').innerText = this.value">
            </div>

            <div class="slider-group">
                <label>HIGH (Treble): <span id="highVal">0</span> dB</label>
                <input type="range" name="eq_high" min="-12" max="12" value="0" oninput="document.getElementById('highVal').innerText = this.value">
            </div>

            <div class="btn-container">
                <a href="studio.html" class="btn-back">⬅️ Kembali</a>
                <button type="submit">✨ Mula Proses Master</button>
            </div>
        </form>
    </div>

</body>
</html>
