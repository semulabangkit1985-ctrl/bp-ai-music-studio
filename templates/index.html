<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Professional Mastering Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-card: #131b2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .studio-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #60a5fa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upload-area {
            border: 2px dashed rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(59, 130, 246, 0.02);
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-area p {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-top: 6px;
            font-weight: 500;
        }

        .upload-area span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .meters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .meter-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .meter-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .meter-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="studio-wrapper">
        <div class="header">
            <h1>BP AI Music Studio</h1>
            <p>Pro Mastering & Co-Producer Console</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>Sumber Audio</span>
                <span style="color: var(--success); font-size: 0.65rem;">● Ready</span>
            </div>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div>📁</div>
                <p>Muat naik fail audio (.mp3, .wav)</p>
                <span id="fileName">Seret atau klik di sini</span>
                <input type="file" id="fileInput" accept="audio/*" style="display: none;" onchange="handleFile(event)">
            </div>
            <audio id="audioPlayer" controls style="width: 100%; margin-top: 12px; display: none;"></audio>
        </div>

        <div class="card">
            <div class="card-title"><span>Analisis & Meters</span></div>
            <div class="meters-grid">
                <div class="meter-box">
                    <div class="meter-label">Loudness</div>
                    <div class="meter-value">-11.2 LUFS</div>
                </div>
                <div class="meter-box">
                    <div class="meter-label">True Peak</div>
                    <div class="meter-value">-1.8 dB</div>
                </div>
            </div>
        </div>

        <button class="btn-primary" type="button" onclick="alert('Analisis & Mastering sedang dijalankan...')">Jalankan AI Mastering</button>
    </div>

    <script>
        function handleFile(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
                const player = document.getElementById('audioPlayer');
                player.src = URL.createObjectURL(file);
                player.style.display = 'block';
                player.play();
            }
        }
    </script>
</body>
</html>
