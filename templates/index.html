<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #121826;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .card-content {
            background-color: #161e31;
            margin: 12px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222d44;
            padding: 24px 20px;
        }

        .step-indicator {
            font-size: 13px;
            color: #60a5fa;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .main-heading {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .section-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Role Selection Grid */
        .roles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .role-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .role-btn:hover, .role-btn.selected {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Next Button */
        .cta-button {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-content">
            <div class="step-indicator">← 4/5</div>
            <h1 class="main-heading">What best represents you?</h1>
            <p class="section-desc">Display the best of yourself and link up with like-minded creators.</p>
            
            <p class="section-desc" style="margin-bottom: 12px; color: #cbd5e1; font-weight: 500;">How would you best describe yourself to others?</p>

            <!-- Senarai Pilihan Peranan -->
            <div class="roles-grid">
                <button class="role-btn selected">Producer</button>
                <button class="role-btn">Musician</button>
                <button class="role-btn">Engineer</button>
                <button class="role-btn">Label</button>
                <button class="role-btn">Podcaster</button>
                <button class="role-btn">Educator</button>
                <button class="role-btn">Beatmaker</button>
                <button class="role-btn">Composer</button>
                <button class="role-btn">Vocalist</button>
                <button class="role-btn">Other</button>
            </div>

            <button class="cta-button">Next →</button>
        </div>
    </div>

    <script>
        // Skrip interaktif ringkas untuk pilih butang peranan
        const buttons = document.querySelectorAll('.role-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });
    </script>

</body>
</html>
