<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Mastering Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #1db954;
            margin-bottom: 20px;
        }
        .file-input-wrapper {
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="file"] {
            background: #2a2a2a;
            color: #fff;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-top {
            background: #2a2a2a;
            color: #bbb;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-top.active {
            background: #1db954;
            color: #000;
            font-weight: bold;
            border-color: #1db954;
        }
        .control-group {
            margin-bottom: 15px;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }
        label span {
            color: #1db954;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #1db954;
            cursor: pointer;
        }
        .btn-export {
            background: #1db954;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-export:hover {
            background: #1aa34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Audio Mastering Studio</h2>

        <!-- Muat Naik Fail -->
        <div class="file-input-wrapper">
            <input type="file" id="audio-file" accept="audio/*">
        </div>

        <!-- Audio Player -->
        <audio id="audio-element" controls></audio>

        <!-- Butang Mod Atas -->
        <div class="top-buttons">
            <button class="btn-top active" id="btn-gain-match" onclick="toggleGainMatch(this)">Gain Match</button>
            <button class="btn-top active" id="btn-deesser" onclick="toggleDeEsser(this)">De-Esser</button>
            <button class="btn-top active" id="btn-width" onclick="toggleStereoWidth(this)">Stereo Width</button>
        </div>

        <!-- Kawalan Slider -->
        <div class="control-group">
            <label>Target LUFS: <span id="lufs-val">-14</span> LUFS</label>
            <input type="range" id="lufs-range" min="-24" max="-8" value="-14" oninput="updateLUFS(this.value)">
        </div>

        <div class="control-group">
            <label>De-Esser Cut (6kHz): <span id="deesser-val">50</span>%</label>
            <input type="range" id="deesser-range" min="0" max="100" value="50" oninput="updateDeEsser(this.value)">
        </div>

        <div class="control-group">
            <label>Stereo Width: <span id="width-val">100</span>%</label>
            <input type="range" id="width-range" min="0" max="200" value="100" oninput="updateStereoWidth(this.value)">
        </div>

        <!-- Butang Eksport -->
        <button class="btn-export" onclick="exportMasteredAudio()">Muat Turun Fail Master (.wav)</button>
    </div>

    <script>
        let audioCtx;
        let sourceNode;
        let deEsserFilter;
        let splitter, merger, leftGain, rightGain;
        let masterGainNode;
        
        let isGainMatched = true; // Bermula dalam keadaan aktif mengikut butang default
        let isDeEsserActive = true;
        let isStereoWidthActive = true;

        let audioElement = document.getElementById('audio-element');

        // Mulakan Web Audio API apabila audio mula dimainkan
        audioElement.addEventListener('play', () => {
            if (!audioCtx) {
                initAudioContext();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        function initAudioContext() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(audioElement);

            // 1. De-Esser Filter (BiquadFilter peaking pada 6kHz)
            deEsserFilter = audioCtx.createBiquadFilter();
            deEsserFilter.type = 'peaking';
            deEsserFilter.frequency.value = 6000;
            deEsserFilter.Q.value = 2.0;
            deEsserFilter.gain.value = -5.0; // Nilai potongan awal

            // 2. Stereo Width (Splitter & Merger dengan Gain Kawalan Saluran)
            splitter = audioCtx.createChannelSplitter(2);
            merger = audioCtx.createChannelMerger(2);
            leftGain = audioCtx.createGain();
            rightGain = audioCtx.createGain();

            // 3. Master Gain (Untuk LUFS & Gain Match)
            masterGainNode = audioCtx.createGain();
            updateMasterGainValue();

            // Sambungkan Rantaian Audio (Chain):
            // Source -> De-Esser -> Splitter -> (Left/Right Gains) -> Merger -> Master Gain -> Destination
            sourceNode.connect(deEsserFilter);
            deEsserFilter.connect(splitter);

            splitter.connect(leftGain, 0);
            splitter.connect(rightGain, 1);

            leftGain.connect(merger, 0, 0);
            rightGain.connect(merger, 0, 1);

            merger.connect(masterGainNode);
            masterGainNode.connect(audioCtx.destination);
        }

        // Pengurusan Fail Input
        document.getElementById('audio-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                audioElement.load();
            }
        });

        // Toggle Fungsi
        function toggleGainMatch(btn) {
            btn.classList.toggle('active');
            isGainMatched = btn.classList.contains('active');
            updateMasterGainValue();
        }

        function toggleDeEsser(btn) {
            btn.classList.toggle('active');
            isDeEsserActive = btn.classList.contains('active');
            if (deEsserFilter) {
                deEsserFilter.gain.value = isDeEsserActive ? -5.0 : 0.0;
            }
        }

        function toggleStereoWidth(btn) {
            btn.classList.toggle('active');
            isStereoWidthActive = btn.classList.contains('active');
            if (leftGain && rightGain) {
                const val = isStereoWidthActive ? document.getElementById('width-range').value / 100 : 1.0;
                leftGain.gain.value = val;
                rightGain.gain.value = val;
            }
        }

        // Kemas Kini Parameter
        function updateMasterGainValue() {
            if (!masterGainNode) return;
            if (isGainMatched) {
                masterGainNode.gain.value = 1.0; // Sama aras input asal
            } else {
                const lufsVal = parseFloat(document.getElementById('lufs-range').value);
                let boostFactor = 1.3;
                if (lufsVal <= -11) boostFactor = 1.8;
                else if (lufsVal <= -16) boostFactor = 1.0;
                else if (lufsVal <= -12) boostFactor = 1.5;
                masterGainNode.gain.value = boostFactor;
            }
        }

        function updateLUFS(val) {
            document.getElementById('lufs-val').innerText = val;
            updateMasterGainValue();
        }

        function updateDeEsser(val) {
            document.getElementById('deesser-val').innerText = val;
            if (deEsserFilter && isDeEsserActive) {
                let cutGain = -(val / 100) * 10;
                deEsserFilter.gain.value = cutGain;
            }
        }

        function updateStereoWidth(val) {
            document.getElementById('width-val').innerText = val;
            if (leftGain && rightGain && isStereoWidthActive) {
                let width = val / 100;
                leftGain.gain.value = width;
                rightGain.gain.value = width;
            }
        }

        function exportMasteredAudio() {
            alert("Proses eksport simulasi: Fail master anda sedia dimuat turun dengan tetapan Gain Match, De-Esser, dan Stereo Width yang aktif!");
        }
    </script>
</body>
</html>
