<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('Untitled design.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-box {
            background-color: rgba(30, 41, 59, 0.9); /* Sedikit latar belakang gelap telus supaya nampak jelas atas gambar */
            padding: 30px;
            border-radius: 15px;
            color: white;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #818cf8;
        }
        p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 15px;
            color: white;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h2>BP AI Music Studio</h2>
        <p>Muat naik fail audio WAV/MP3 untuk proses mastering automatik.</p>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit">Mula Master Audio</button>
        </form>
    </div>

</body>
</html>
