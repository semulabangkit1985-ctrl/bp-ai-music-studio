<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Studio Console - Muat Naik</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141c2e;
            --card-border: #1e293b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background-image: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.95)), url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.5rem; color: #60a5fa; letter-spacing: 1px; font-weight: 700; margin-bottom: 0.5rem; }
        header p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .section-title { font-size: 0.9rem; font-weight: 700; color: #93c5fd; margin-bottom: 0.5rem; text-transform: uppercase; }
        .section-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.4; }
        .file-input-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            outline: none;
        }
        .btn-action {
            display: block;
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: background 0.2s;
        }
        .btn-action:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BP AI STUDIO CONSOLE</h1>
            <p>Platform mastering audio pintar berkuasa AI untuk kualiti bunyi gred profesional.</p>
        </header>
        <div class="card">
            <div class="section-title">Muat Naik Trek Audio</div>
            <div class="section-desc">Pilih fail format .mp3 atau .wav untuk mula diproses:</div>
            <div class="file-input-box">
                <input type="file" accept=".mp3,.wav" style="color: #cbd5e1; width: 100%;">
            </div>
            
            <div class="section-title">Pilih Genre Lagu</div>
            <div class="section-desc">Tetapkan genre bagi membantu AI membuat penyesuaian:</div>
            <select>
                <option>Malaya / Melayu</option>
                <option>Pop / Ballad</option>
                <option>Rock / Indie</option>
                <option>Hip Hop / R&B</option>
            </select>

            <a href="/mastering" class="btn-action">Seterusnya ke Mastering Styles ➔</a>
        </div>
    </div>
</body>
</html>
