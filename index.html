<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Pro Mastering Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #0b0f19;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .studio-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            box-sizing: border-box;
            background: #0b0f19;
            overflow: hidden;
        }

        /* POSTER DENGAN GRID BERTINDIH */
        .poster-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            width: 100%;
            position: relative;
        }

        .vertical-poster, .poster-text-overlay {
            grid-area: 1 / 1;
        }

        .vertical-poster {
            width: 100%;
            height: auto;
            display: block;
            /* IMEJ POSTER DITERANGKAN LAGI */
            filter: brightness(1.18) contrast(1.05); 
        }

        /* LATAR BELAKANG LEBIH TERANG & JELAS */
        .poster-text-overlay {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            box-sizing: border-box;
            text-align: center;
            background: rgba(11, 15, 25, 0.15);
            z-index: 2;
        }

        .poster-title {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #60a5fa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.98);
        }

        .poster-desc {
            font-size: 11.5px;
            line-height: 1.7;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            max-width: 98%;
            font-weight: 500;
        }

        .poster-quote-box {
            margin-top: 4px;
            margin-bottom: 14px;
            padding: 9px 14px;
            background: rgba(15, 23, 42, 0.7);
            border-left: 4px solid #fbbf24;
            border-radius: 6px;
            text-align: left;
            width: 90%;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .poster-quote-title {
            font-family: 'Syne', sans-serif;
            font-size: 11.5px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        .poster-quote {
            font-size: 11.5px;
            font-weight: 700;
            color: #fbbf24;
            font-style: italic;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        /* KOTAK BORANG UNTUK HALAMAN SETERUSNYA */
        .overlay-card {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(11, 15, 25, 0.98) 82%, rgba(11, 15, 25, 0.95) 96%, transparent);
            padding: 25px 20px 20px 20px;
            box-sizing: border-box;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 10;
        }

        .step-indicator {
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-label {
            font-family: 'Syne', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }

        input[type="file"], input[type="text"] {
            background: #1e293b;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
            width: 100%;
            color: #cbd5e1;
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        input[type="file"] {
            border: 1px dashed #3b82f6;
            cursor: pointer;
        }

        .status-ready {
            font-size: 11.5px;
            color: #34d399;
            margin-bottom: 10px;
            font-weight: 700;
            display: none;
        }

        .custom-select-box {
            position: relative;
            margin-bottom: 10px;
        }

        .select-trigger {
            background: #1e293b;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
            width: 100%;
            color: #cbd5e1;
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            background: #1e293b;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            z-index: 99;
            display: none;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .select-dropdown.show {
            display: block;
        }

        .option-group-title {
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            color: #fbbf24;
            padding: 6px 12px;
            background: #0f172a;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .option-item {
            padding: 9px 12px;
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            border-bottom: 1px solid #334155;
            font-weight: 500;
        }

        .option-item:hover {
            background: #3b82f6;
            color: white;
        }

        .grid-effects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .effect-btn {
            background: #1e293b;
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: white;
            padding: 9px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-family: 'Syne', sans-serif;
        }

        .effect-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .btn-container {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
        }

        .btn-back {
            background: #334155;
            box-shadow: none;
        }

        .hidden {
            display: none;
        }

            width: 100%;
            margin-top: 6px;
