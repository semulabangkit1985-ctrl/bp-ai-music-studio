function playAB(type){
 if(playing===type){ stopAB(); return; }
 stopAB();
 try{
   if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
   if(audioCtx.state==='suspended') audioCtx.resume();
   osc = audioCtx.createOscillator(); gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
   osc.type = type==='mastered'?'sawtooth':'sine'; osc.frequency.value=110;
   if(type==='mastered'){ const shaper = audioCtx.createWaveShaper(); const curve=new Float32Array(44100); for(let i=0;i<44100;i++){let x=i*2/44100-1; curve[i]=123*x*20*(Math.PI/180)/(Math.PI+120*Math.abs(x));} shaper.curve=curve; shaper.oversample='4x'; filter.type='highshelf'; filter.frequency.value=3200; filter.gain.value=6; gain.gain.value=0.65; osc.connect(shaper); shaper.connect(filter); filter.connect(gain);} else { gain.gain.value=0.25; osc.connect(gain); }
   gain.connect(audioCtx.destination); osc.start(); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+1.9); osc.stop(audioCtx.currentTime+2); playing=type; render(); drawWave(); osc.onended=()=>{playing=null; render();};
 }catch(e){ playing=type; render(); setTimeout(()=>{playing=null; render();},1900);}
}
function stopAB(){ try{osc?.stop();}catch{} try{osc?.disconnect(); gain?.disconnect();}catch{} playing=null; render(); }
function drawWave(){
 const c=document.getElementById('wave'); if(!c) return; const ctx=c.getContext('2d'); let t=0; const bars=isMobile?32:64;
 function loop(){
   if(!playing){ ctx.clearRect(0,0,c.width,c.height); for(let i=0;i<bars;i++){ ctx.fillStyle='#1E1E1E'; const x=i*(c.width/bars)+2; ctx.fillRect(x,c.height/2-4, (c.width/bars)-4, 8);} return;}
   t+=0.06; ctx.clearRect(0,0,c.width,c.height);
   for(let i=0;i<bars;i++){ const amp = playing==='mastered'?0.85:0.45; const h = (Math.sin(i*0.3+t)*0.5+0.5)*amp*c.height*0.8 + 4 + Math.random()*3; const x=i*(c.width/bars)+2; const y=c.height/2-h/2; ctx.fillStyle = playing==='mastered'?(i%3===0?'#00D4FF':'#7C3AED'):(i%3===0?'#3A3A3A':'#1E1E1E'); ctx.beginPath(); ctx.roundRect(x,y,(c.width/bars)-4,h,3); ctx.fill(); }
   requestAnimationFrame(loop);
 } loop();
}

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.post
