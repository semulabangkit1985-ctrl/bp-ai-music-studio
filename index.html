<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Smart Mastering</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">
    <header class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-cyan-400">BP AI MUSIC STUDIO</h1>
        <span class="text-xs bg-cyan-950 text-cyan-300 px-3 py-1 rounded-full border border-cyan-800">v2.0 Pro</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-bold mb-3">Platform Mastering Audio Pintar</h2>
            <p class="text-gray-400 text-sm mb-8">Muat naik fail audio anda (WAV/MP3) untuk proses pembersihan dan penambahbaikan kualiti bunyi bertaraf studio.</p>
            
            <form action="/upload" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div class="border-2 border-dashed border-gray-700 hover:border-cyan-500 rounded-xl p-8 transition cursor-pointer bg-gray-950/50">
                    <input type="file" name="audio_file" accept=".mp3,.wav" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
                </div>
                <button type="submit" class="w-full py-3 px-6 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 font-semibold rounded-xl shadow-lg transition duration-200">
                    Mula Mastering ➔
                </button>
            </form>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-gray-600 border-t border-gray-900">
        &copy; 2026 BP AI Music Studio. Hak Cipta Terpelihara.
    </footer>
</body>
</html>
