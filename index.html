<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('Untitled design.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-box {
            background-color: rgba(30, 41, 59, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            color: white;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 {
            margin-top: 0;
            color: #818cf8;
            font-size: 24px;
        }
        p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .btn-enter {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .btn-enter:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>BP AI Music Studio</h1>
        <p>Sistem Mastering Audio Pintar Berasaskan AI</p>
        <a href="studio.html" class="btn-enter">Masuk ke Studio</a>
    </div>

</body>
</html>
