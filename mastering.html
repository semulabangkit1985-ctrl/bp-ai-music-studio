<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsol Mastering - BP AI Music Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">
    <header class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-cyan-400">DAW MASTERING CONSOLE</h1>
        <a href="/" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg transition">← Muat Naik Semula</a>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-6 space-y-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-2 text-cyan-300">Fail Aktif: <span class="text-white font-normal">{{ filename if filename else 'Tiada Fail Dipilih' }}</span></h2>
            <p class="text-xs text-gray-400">Laraskan parameter pemprosesan AI di bawah atau guna pratetap automatik.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                <h3 class="font-semibold text-sm text-gray-300 uppercase tracking-wider">Pilihan Genre / Vibe</h3>
                <select class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-gray-200 focus:outline-none focus:border-cyan-500">
                    <option>Commercial Pop / Modern Radio</option>
                    <option>Hip-Hop / Phonk Heavy Bass</option>
                    <option>Acoustic / Warm Vocal</option>
                    <option>Cinematic / Orchestral</option>
                </select>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                <h3 class="font-semibold text-sm text-gray-300 uppercase tracking-wider">Kawalan Intensiti AI</h3>
                <input type="range" min="1" max="100" value="75" class="w-full accent-cyan-500 cursor-pointer">
                <div class="flex justify-between text-xs text-gray-500">
                    <span>Lembut</span>
                    <span>Seimbang</span>
                    <span>Maksimum</span>
                </div>
            </div>
        </div>

        <div class="pt-4 flex justify-end">
            <button onclick="alert('Proses mastering AI sedang dijalankan... Sila tunggu sebentar.')" class="py-3 px-8 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded-xl shadow-lg transition duration-200">
                Proses & Muat Turun Master 🎵
            </button>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-gray-600 border-t border-gray-900">
        &copy; 2026 BP AI Music Studio.
    </footer>
</body>
</html>
