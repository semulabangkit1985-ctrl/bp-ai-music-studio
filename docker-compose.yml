version: "3.9"

services:

  api:
    build: .
    container_name: soniq-master-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: soniq-master-ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
