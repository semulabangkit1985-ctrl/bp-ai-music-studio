<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Hasil Mastering</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1px solid #3b82f6;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            color: #34d399;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin: 20px 0;
            border-radius: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            border: none;
            text-decoration: none;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btn-download {
            background: #10b981;
            color: white;
        }
        .btn-download:hover {
            background: #059669;
        }
        .btn-reset {
            background: #334155;
            color: white;
        }
        .btn-reset:hover {
            background: #475569;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h1>🎉 Mastering Selesai!</h1>
    <div class="subtitle">Fail audio anda telah berjaya dimastering mengikut tetapan anda.</div>

    <!-- Pemain Audio dengan trek demo berfungsi -->
    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Pelayar anda tidak menyokong elemen audio.
    </audio>

    <a href="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" download="Mastered_Song.mp3" class="btn btn-download">📥 Muat Turun Fail Audio</a>
    <a href="/studioai.html" class="btn btn-reset">🔄 Master Audio Lain</a>
</div>

</body>
</html>
