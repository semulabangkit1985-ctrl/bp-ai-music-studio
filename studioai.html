<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Master Rasmi</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1px solid #3b82f6;
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: #60a5fa;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #fbbf24;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .step-indicator {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .section-label {
            font-size: 13px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
            display: block;
        }
        input[type="file"], select, input[type="text"] {
            background: #1e293b;
            border: 1px solid #3b82f6;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            color: #cbd5e1;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        input[type="file"] {
            border: 1px dashed #3b82f6;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: #4f46e5;
            color: white;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #6366f1;
        }
        .btn-back {
            background: #334155;
        }
        .btn-back:hover {
            background: #475569;
        }
        .hidden {
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }
        .info-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            border-left: 4px solid #3b82f6;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h1>BP AI Music Studio</h1>
    <div class="subtitle">ROCK · HIP HOP · MALAYA & MORE</div>

    <!-- ================= LANGKAH 1 ================= -->
    <div id="step1">
        <div class="step-indicator">Langkah 1 dari 2: Muat Naik Fail Suno & Genre</div>
        
        <span class="section-label">📁 Pilih Fail Audio Suno Anda (MP3 / WAV)</span>
        <input type="file" id="audioFile" accept="audio/*">

        <span class="section-label">🎵 Cari & Pilih Genre Muzik</span>
        <input type="text" id="genreSearch" placeholder="Taip genre (cth: Phonk, Bass, Raya)..." onkeyup="filterGenres()">

        <select id="genreSelect" size="6" style="cursor: pointer; font-weight: bold;">
            <optgroup label="🇲🇾 Melayu / Nusantara">
                <option value="Malaya / Melayu">Malaya / Melayu</option>
                <option value="Pop Melayu">Pop Melayu</option>
                <option value="Rock Melayu">Rock Melayu</option>
                <option value="Balada Melayu">Balada Melayu</option>
            </optgroup>
            <optgroup label="⚡ Elektronik & Phonk">
                <option value="Techno">Techno</option>
                <option value="Dark Techno / Neon Noir Phonk - Malay Bounce">Dark Techno / Neon Noir Phonk - Malay Bounce</option>
                <option value="Synthwave">Synthwave</option>
            </optgroup>
            <optgroup label="🚗 Car Audio & Bass">
                <option value="Bass Car Music">Bass Car Music</option>
            </optgroup>
            <optgroup label="🎬 Gaya Khas">
                <option value="Cinematic">Cinematic</option>
                <option value="Epic">Epic</option>
                <option value="Raya / Aidilfitri">Raya / Aidilfitri</option>
            </optgroup>
        </select>

        <div class="btn-container">
            <button type="button" class="btn" onclick="goToStep2()">Seterusnya ➡️</button>
        </div>
    </div>

    <!-- ================= LANGKAH 2 (STUDIO MASTERING) ================= -->
    <div id="step2" class="hidden">
        <div class="step-indicator">Langkah 2 dari 2: Studio Mastering Audio Anda</div>
        
        <div class="info-box">
            <div><strong>Fail Suno:</strong> <span id="fileName" style="color: #60a5fa;">-</span></div>
            <div><strong>Genre Pilihan:</strong> <span id="selectedGenre" style="color: #fbbf24;">-</span></div>
        </div>

        <span class="section-label">🎧 Pemain Audio Rasmi (Fail Sebenar Anda)</span>
        <audio id="audioPlayer" controls></audio>

        <div class="btn-container">
            <button type="button" class="btn btn-back" onclick="goToStep1()">⬅️ Kembali</button>
            <button type="button" class="btn" onclick="alert('Tahniah! Lagu Suno anda sedia dimuat turun dengan jayanya!')">Simpan & Muat Turun</button>
        </div>
    </div>
</div>

<!-- Skrip Pintar -->
<script>
function filterGenres() {
    let input = document.getElementById('genreSearch').value.toLowerCase();
    let select = document.getElementById('genreSelect');
    let optgroups = select.getElementsByTagName('optgroup');

    for (let i = 0; i < optgroups.length; i++) {
        let options = optgroups[i].getElementsByTagName('option');
        let groupHasMatch = false;

        for (let j = 0; j < options.length; j++) {
            let txt = options[j].text.toLowerCase();
            if (txt.includes(input)) {
                options[j].style.display = "";
                groupHasMatch = true;
            } else {
                options[j].style.display = "none";
            }
        }
        optgroups[i].style.display = groupHasMatch ? "" : "none";
    }
}

function goToStep2() {
    const fileInput = document.getElementById('audioFile');
    const genreSelect = document.getElementById('genreSelect');
    
    if (fileInput.files.length === 0) {
        alert('Sila pilih fail audio Suno anda terlebih dahulu!');
        return;
    }

    let file = fileInput.files[0];
    let genreValue = genreSelect.value || "Tidak dipilih";

    // Paparkan maklumat fail & genre di Langkah 2
    document.getElementById('fileName').innerText = file.name;
    document.getElementById('selectedGenre').innerText = genreValue;

    // Masukkan fail sebenar ke dalam pemain audio (Blob URL)
    let audioURL = URL.createObjectURL(file);
    let player = document.getElementById('audioPlayer');
    player.src = audioURL;

    // Tukar paparan skrin dari Langkah 1 ke Langkah 2
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
}

function goToStep1() {
    // Kembali ke Langkah 1 dan hentikan audio
    let player = document.getElementById('audioPlayer');
    player.pause();
    player.src = "";

    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
}
</script>
</body>
</html>
