<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langkah 1 - BP AI Music Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('Untitled design.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-box {
            background-color: rgba(30, 41, 59, 0.95);
            padding: 25px;
            border-radius: 15px;
            color: white;
            text-align: left;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #818cf8;
            text-align: center;
            margin-bottom: 5px;
        }
        .tagline {
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .step-indicator {
            text-align: center;
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .section-title {
            font-size: 14px;
            color: #38bdf8;
            margin: 15px 0 8px 0;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            margin-bottom: 15px;
            color: white;
        }
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .genre-grid label {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 10px 5px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .genre-grid input {
            accent-color: #3b82f6;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button, .btn-back {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        button {
            flex: 2;
        }
        .btn-back {
            background-color: #475569;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background-color: #4338ca;
        }
        .btn-back:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h2>BP AI Music Studio</h2>
        <div class="tagline">ROCK · HIP HOP · MALAYA</div>
        <div class="step-indicator">Langkah 1 dari 2: Muat Naik & Genre</div>
        
        <!-- Pautan ke halaman seterusnya (Langkah 2: effects.html) -->
        <form action="effects.html" method="get">
            
            <div class="section-title">📁 Pilih Fail Audio</div>
            <input type="file" name="file" required>

            <div class="section-title">🎵 Pilih Genre Muzik</div>
            <div class="genre-grid">
                <label><input type="radio" name="genre" value="rock" checked> Rock</label>
                <label><input type="radio" name="genre" value="hiphop"> Hip Hop</label>
                <label><input type="radio" name="genre" value="malaya"> Malaya</label>
            </div>

            <div class="btn-container">
                <a href="index.html" class="btn-back">Utama</a>
                <button type="submit">Seterusnya ➡️</button>
            </div>
        </form>
    </div>

</body>
</html>
