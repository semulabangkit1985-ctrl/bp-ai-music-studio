<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP AI Music Studio - Full Studio</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .studio-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 1px solid #3b82f6;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            color: #60a5fa;
            margin-bottom: 2px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #fbbf24;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .step-indicator {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .section-label {
            font-size: 12px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 6px;
            display: block;
        }
        input[type="file"], select, input[type="text"] {
            background: #1e293b;
            border: 1px solid #3b82f6;
            padding: 9px;
            border-radius: 8px;
            width: 100%;
            color: #cbd5e1;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input[type="file"] {
            border: 1px dashed #3b82f6;
        }
        .grid-effects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .effect-btn {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .effect-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }
        .slider-box {
            margin-bottom: 12px;
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .slider-box label {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
        }
        .eq-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .eq-slider {
            flex: 1;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }
        .eq-slider span {
            font-size: 10px;
            color: #94a3b8;
        }
        .btn-container {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: #4f46e5;
            color: white;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #6366f1;
        }
        .btn-back {
            background: #334155;
        }
        .btn-back:hover {
            background: #475569;
        }
        .hidden {
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            height: 36px;
        }
        .info-box {
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 11px;
            border-left: 4px solid #3b82f6;
            line-height: 1.4;
        }
    </style>
</head>
